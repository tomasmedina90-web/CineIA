
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10110f">
<meta name="description" content="CineAI Photo Engine: editor fotográfico gratuito con ajustes y looks cinematográficos locales.">
<title>CineAI Photo Engine</title>
<style>
:root{--bg:#10110f;--panel:#1b1d19;--lime:#d5ff65;--text:#f4f4ed;--muted:#a3a69a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:22px 18px 16px;border-bottom:1px solid #30322b}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--lime)}
header p{color:var(--muted);font-size:12px;margin:6px 0 0}
main{max-width:650px;margin:auto;padding:16px}
.preview{background:#080908;border-radius:16px;min-height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#photo{display:none;max-width:100%;width:100%;max-height:55vh;object-fit:contain}
#empty{text-align:center;padding:35px;color:var(--muted);line-height:1.8}
#empty strong{display:block;color:white;font-size:16px}
.tag{position:absolute;top:12px;left:12px;background:#171914dd;padding:7px 10px;border-radius:7px;font-size:10px;letter-spacing:1px}
.actions{display:flex;gap:9px;margin:13px 0;flex-wrap:wrap}
button,.upload{border:0;border-radius:10px;padding:13px 12px;font-weight:700;font-size:12px;cursor:pointer;text-align:center}
.upload{background:var(--lime);color:#171910;flex:1}
button{background:#292b25;color:white}
button.primary{background:var(--lime);color:#171910;flex:1}
input[type=file]{display:none}
.panel{background:var(--panel);border-radius:14px;padding:16px;margin-top:13px}
.panel h2{font-size:13px;margin:0 0 15px;letter-spacing:.5px}
.control{margin:17px 0}
.line{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:10px}
.line span:last-child{color:var(--lime);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--lime);height:22px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.preset{border:1px solid #393c32;background:#22241f;padding:14px 8px;min-height:54px}
.preset small{display:block;color:var(--muted);font-weight:400;margin-top:4px;font-size:10px}
.preset.active{border-color:var(--lime);color:var(--lime)}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:22px}
button:active,.upload:active{opacity:.7}
</style>
</head>
<body>
<header>
<div class="logo">CINEAI <span>PHOTO ENGINE</span></div>
<p>YOUR PHOTO. YOUR VISION. YOUR ENGINE.</p>
</header>
<main>
<div class="preview">
<div id="empty">✦<strong>Tu estudio creativo</strong>Selecciona una fotografía para comenzar</div>
<img id="photo" alt="Vista previa de tu fotografía">
<div class="tag" id="status">PHOTO STUDIO · 02</div>
</div>
<div class="actions">
<label class="upload" for="file">＋ ABRIR FOTO</label>
<input id="file" type="file" accept="image/*">
<button id="compare">ANTES</button>
<button id="reset">REINICIAR</button>
</div>

<section class="panel">
<h2>✦ LOOKS CINEMATOGRÁFICOS</h2>
<div class="presets">
<button class="preset active" data-preset="original">Natural<small>Sin ajustes</small></button>
<button class="preset" data-preset="cinema">Cine<small>Contraste y color</small></button>
<button class="preset" data-preset="warm">Dorado<small>Temperatura cálida</small></button>
<button class="preset" data-preset="mono">Blanco y negro<small>Monocromo</small></button>
<button class="preset" data-preset="portrait">Retrato<small>Luz suave</small></button>
<button class="preset" data-preset="night">Noche<small>Oscuro y dramático</small></button>
</div>
</section>

<section class="panel">
<h2>✦ AJUSTES DE IMAGEN</h2>
<div class="control">
<div class="line"><label for="exposure">Exposición</label><span id="exposureVal">0</span></div>
<input id="exposure" type="range" min="-100" max="100" value="0">
</div>
<div class="control">
<div class="line"><label for="contrast">Contraste</label><span id="contrastVal">0</span></div>
<input id="contrast" type="range" min="-100" max="100" value="0">
</div>
<div class="control">
<div class="line"><label for="saturation">Saturación</label><span id="saturationVal">0</span></div>
<input id="saturation" type="range" min="-100" max="100" value="0">
</div>
<div class="control">
<div class="line"><label for="warmth">Temperatura</label><span id="warmthVal">0</span></div>
<input id="warmth" type="range" min="-100" max="100" value="0">
</div>
</section>

<div class="actions">
<button class="primary" id="export">↓ EXPORTAR JPG</button>
</div>
<div class="footer">CineAI Photo Engine · Prototype 0.2<br>Edición local en tu dispositivo · No se suben tus fotos</div>
</main>

<script>
const photo=document.getElementById('photo');
const file=document.getElementById('file');
const empty=document.getElementById('empty');
const ids=['exposure','contrast','saturation','warmth'];

const presets={
original:{exposure:0,contrast:0,saturation:0,warmth:0},
cinema:{exposure:-5,contrast:24,saturation:12,warmth:-8},
warm:{exposure:5,contrast:8,saturation:10,warmth:38},
mono:{exposure:0,contrast:18,saturation:-100,warmth:0},
portrait:{exposure:12,contrast:-12,saturation:-5,warmth:12},
night:{exposure:-24,contrast:32,saturation:-18,warmth:-18}
};

let originalURL=null;
let showOriginal=false;

function values(){
return Object.fromEntries(ids.map(id=>[
id,Number(document.getElementById(id).value)
]));
}

function markPreset(name){
document.querySelectorAll('.preset').forEach(button=>{
button.classList.toggle('active',button.dataset.preset===name);
});
}

function update(){
ids.forEach(id=>{
const n=Number(document.getElementById(id).value);
document.getElementById(id+'Val').textContent=(n>0?'+':'')+n;
});
if(!showOriginal)applyPreview();
}

function applyPreview(){
const v=values();
photo.style.filter=
'brightness('+Math.pow(2,v.exposure/100)+') '+
'contrast('+(1+v.contrast/100)+') '+
'saturate('+(1+v.saturation/100)+') '+
'sepia('+(Math.max(0,v.warmth)/200)+') '+
'hue-rotate('+(v.warmth<0?Math.abs(v.warmth)*0.5:0)+'deg)';
}

function applyPreset(name){
const preset=presets[name];
if(!preset)return;

ids.forEach(id=>{
document.getElementById(id).value=preset[id];
});

showOriginal=false;
document.getElementById('compare').textContent='ANTES';
markPreset(name);
update();
}

file.addEventListener('change',()=>{
const f=file.files&&file.files[0];
if(!f)return;

if(!f.type.startsWith('image/')){
alert('Selecciona un archivo de imagen.');
return;
}

if(originalURL)URL.revokeObjectURL(originalURL);
originalURL=URL.createObjectURL(f);

photo.onload=()=>{
photo.style.display='block';
empty.style.display='none';
document.getElementById('status').textContent='CINEAI · READY';
applyPreset('original');
};

photo.onerror=()=>{
alert('No se pudo abrir esta imagen. Prueba con otro archivo.');
URL.revokeObjectURL(originalURL);
originalURL=null;
};

photo.src=originalURL;
});

ids.forEach(id=>{
document.getElementById(id).addEventListener('input',()=>{
markPreset('');
update();
});
});

document.querySelectorAll('.preset').forEach(button=>{
button.addEventListener('click',()=>{
applyPreset(button.dataset.preset);
});
});

document.getElementById('compare').addEventListener('click',()=>{
if(!photo.naturalWidth)return;

showOriginal=!showOriginal;
document.getElementById('compare').textContent=
showOriginal?'DESPUÉS':'ANTES';

if(showOriginal)photo.style.filter='none';
else applyPreview();
});

document.getElementById('reset').addEventListener('click',()=>{
applyPreset('original');
});

document.getElementById('export').addEventListener('click',()=>{
if(!photo.naturalWidth){
alert('Primero abre una fotografía.');
return;
}

const canvas=document.createElement('canvas');
const scale=Math.min(
1,
2400/Math.max(photo.naturalWidth,photo.naturalHeight)
);

canvas.width=Math.round(photo.naturalWidth*scale);
canvas.height=Math.round(photo.naturalHeight*scale);

const ctx=canvas.getContext('2d',{willReadFrequently:true});
ctx.drawImage(photo,0,0,canvas.width,canvas.height);

const img=ctx.getImageData(0,0,canvas.width,canvas.height);
const d=img.data;
const v=values();

const exposure=Math.pow(2,v.exposure/100);
const contrast=1+v.contrast/100;
const saturation=1+v.saturation/100;
const warmth=v.warmth*.65;

for(let i=0;i<d.length;i+=4){
let r=d[i]*exposure;
let g=d[i+1]*exposure;
let b=d[i+2]*exposure;

r=(r-128)*contrast+128+warmth;
g=(g-128)*contrast+128+warmth*.15;
b=(b-128)*contrast+128-warmth;

const gray=.2126*r+.7152*g+.0722*b;

d[i]=Math.max(0,Math.min(255,gray+(r-gray)*saturation));
d[i+1]=Math.max(0,Math.min(255,gray+(g-gray)*saturation));
d[i+2]=Math.max(0,Math.min(255,gray+(b-gray)*saturation));
}

ctx.putImageData(img,0,0);

canvas.toBlob(blob=>{
if(!blob){
alert('No se pudo exportar la imagen.');
return;
}

const url=URL.createObjectURL(blob);
const a=document.createElement('a');

a.href=url;
a.download='cineai-photo.jpg';
document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),2000);
},'image/jpeg',.94);
});
</script>
</body>
</html>
